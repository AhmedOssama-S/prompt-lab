# Judge rubric for Record Evaluator (Auto-Judge page)
# Derived directly from the rule checklist inside v1.txt / v2.txt itself,
# not invented separately — see PROMPT_LAB_PLAN.md section 6.5 / 7.
#
# Each key becomes one custom criterion passed to the LangChain pairwise
# evaluator: {name: description}. Descriptions are phrased as yes/no
# compliance checks so the judge scores rule-adherence, not just "vibes".

grounding:
  description: >
    Does the output use ONLY facts explicitly present in the input content?
    Penalize invented numbers, results, awards, partnerships, dates,
    technologies, or entities not present in the source content.

no_false_scope:
  description: >
    Does the output avoid claiming national/regional/international impact
    unless the content gives explicit evidence of dissemination or adoption?
    A location word (e.g. "UAE") or identity phrase (e.g. "first Emirati")
    alone is NOT valid scope evidence — flag any output that treats it as such.

verbatim_facts:
  description: >
    Are names, numbers, awards, programs, and dates quoted verbatim as they
    appear in the source content, with no embellishment or added qualifiers?

banned_phrases:
  description: >
    Does the output avoid the specific banned phrase "يبرز النص" (or English
    equivalents like "the text highlights") and avoid referring to the
    candidate's submission as "النص" ("the text")? Approved alternatives are
    "هذا الترشيح" / "هذا المرشح" ("the nomination file" / "the candidate").

no_title_colon_opening:
  description: >
    Does every strength and improvement point start directly with content,
    with NO short title or header followed by a colon before it?

candidate_focused_opening:
  description: >
    Do strength points begin with a candidate-focused summary phrase such as
    "أظهر المرشح..."، "حقق المرشح..."، "تمكّن المرشح من..." (or English
    equivalents like "The candidate demonstrated...")?

two_facet_construction:
  description: >
    Does each point combine two facets — for strengths: (what the candidate
    did) + (why it matters in context); for improvements: (what is missing)
    + (what its absence costs the evaluation)? Single-facet, generic points
    should be penalized.

concrete_anchor:
  description: >
    Does every strength point include a concrete anchor (a named
    program/system/committee, institution, specialty, or date), with every
    number paired with its effect (e.g. "بنسبة X%", "من 180 إلى 60 دقيقة")?

depth_calibration:
  description: >
    Is the number of points proportional to the achievement type — 2
    concise points for a routine/foundational item, 3-4 deeper points for a
    pioneering/exceptional one? Does it correctly avoid demanding
    performance numbers from a pioneering "first-of-its-kind" item while
    still expecting them for an operational item?

recommendations_build_on_strengths:
  description: >
    Do recommendations build forward on a stated strength as a future step,
    rather than re-wording an already-listed area for improvement? Do they
    stay within the individual candidate's own scope of influence (not
    institutional-level strategy)?

json_validity:
  description: >
    Is the output a single valid JSON object (no markdown wrapper, no
    asterisks/formatting marks) containing both arabic_analysis and
    english_analysis, each with strengths, areas_for_improvement, and
    recommendations arrays?

# --- Business acceptance-criteria additions (Medals_AI_UC1_UC2_Business_
# Acceptance_Criteria.html, Aug 2026). Two different kinds of gap, marked
# per criterion: some check a rule ALREADY in v1.txt/v2.txt that simply had
# no judge coverage yet; others (marked NOTE) are a forward-looking business
# bar not yet written into either version's stored prompt -- score both
# sides anyway, since a gap there is a real finding, not a false failure.

full_rubric_coverage:
  description: >
    Does the output assess ALL aspects/dimensions of the excellence
    (80-100%) rubric comprehensively, with none skipped, and analyze only
    fields actually present in the request? Already explicit in the prompt
    ("Assess ALL aspects mentioned in the rubric comprehensively; do not
    skip any criteria or dimension") -- this checks whether the model
    actually complied, not whether the instruction exists.

formal_verb_usage:
  description: >
    Do strength points use formal government verbs (بادر، أسهم، حقق، قاد،
    رسّخ, or English equivalents like "initiated," "led," "established"),
    rather than casual phrasing? Already explicit in the prompt (rule 7
    under strengths formatting).

no_multi_phase_date_suggestion:
  description: >
    Does the output avoid suggesting a date be split into multiple phases or
    entries? The system allows only one date entry per field -- already
    explicit in the prompt's mandatory requirements.

improvement_specificity:
  description: >
    Is each improvement point specific to THIS record's actual content --
    naming a real, concretely absent detail (e.g. "does not document the
    number of procedures since the unit's establishment in 2023") -- rather
    than a generic template phrase like "lacks quantitative indicators" that
    could apply to any record?

performance_dimension_linking:
  description: >
    NOTE: not currently instructed anywhere in record_evaluator's stored
    v1/v2 prompt -- a forward-looking bar from the business acceptance doc,
    not a real prompt requirement yet, so don't be surprised if both sides
    fall short. Are strengths explicitly linked to the performance
    dimensions (الأداء / المساهمات / النمو / الانفتاح) where relevant to
    that point?

client_only_attribution:
  description: >
    NOTE: v1/v2's stored prompt has no client_name or entity-scoping concept
    at all currently -- this is a forward-looking business bar (G10), not
    yet a real prompt instruction, so a gap here reflects the prompt's
    current state, not a model failure. Is the candidate/entity named only
    as the one assigned client, with no other organization or another
    candidate's data mixed in?

overall_quality:
  description: >
    Holistic judgment: which output would a human government-excellence
    evaluator find more useful, precise, and well-grounded, all else equal?
