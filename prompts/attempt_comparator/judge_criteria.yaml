# Judge rubric for Attempt Comparator (Auto-Judge, runs inline on Compare).
# Derived directly from the rule checklist inside main_prompt.txt itself --
# see PROMPT_LAB_PLAN.md / PHASE2_PLAN.md section 1.7. Applies equally to
# both sides -- the prompt text is byte-identical between v1 and v2 for this
# use case (see schemas/SCHEMAS.md provenance note), so none of these are a
# v1-vs-v2 differentiator; they're just what a good comparison looks like.

grounding:
  description: >
    Does the output use ONLY facts present in the inputs? Penalize invented
    numbers, results, awards, partnerships, dates, or entities not present
    in the achievements being compared.

no_false_scope:
  description: >
    Does the output avoid claiming national/regional/international impact
    unless an achievement gives explicit evidence of dissemination or
    adoption? A location word (e.g. "UAE") or identity phrase (e.g. "first
    Emirati") alone is NOT valid scope evidence.

verbatim_facts:
  description: >
    Are names, numbers, awards, programs, and dates quoted exactly as
    written in the inputs, with no embellishment?

pioneering_awareness:
  description: >
    Does the output avoid demanding performance numbers from a pioneering /
    "first-of-its-kind" input (pioneering nature alone should be enough),
    while still expecting clear quantitative figures for operational inputs?
    Does it correctly classify each input as pioneering, operational,
    strategic, or foundational rather than treating them all the same way?

concrete_anchoring:
  description: >
    Does every point in individual_analysis include a concrete anchor from
    that specific input -- a named program/committee/system, a number with
    its unit, an institution, a date, a specialty, or an award -- rather
    than a generic observation that could apply to any input?

differentiation_clarity:
  description: >
    When two inputs are close in quality, does the output explicitly state
    the deciding factor, rather than asserting a winner without justification?

terminology_consistency:
  description: >
    Does the output refer to each achievement consistently -- by its actual
    title when titles were available, or consistently as "Input N" /
    "المُدخل N" when they weren't -- without mixing the two styles or
    inventing a label not licensed by the terminology rule actually in force
    for this run?

no_rank_word:
  description: >
    Does the output avoid the word "الرتبة" ("rank") anywhere, presenting
    the final ranking as a plain numbered list instead?

record_id_validity:
  description: >
    Does the returned record_id correspond to one of the achievements
    actually presented in the input (by id or by matching title), rather
    than an invented or mismatched identifier?

# --- Business acceptance-criteria additions (Medals_AI_UC1_UC2_Business_
# Acceptance_Criteria.html, Aug 2026). Marked per criterion whether it
# checks a rule ALREADY in main_prompt.txt with no judge coverage yet, or
# (NOTE) a forward-looking business bar not yet written into the prompt.

all_inputs_individually_analyzed:
  description: >
    Does individual_analysis cover EVERY achievement in the input array
    with its own concrete-anchored point, none skipped, before the
    comparative analysis begins? Already explicit in the prompt ("You MUST
    analyze and compare ALL of them individually, then collectively").

dimension_based_comparison:
  description: >
    Does comparative_analysis visibly weigh the inputs on the prompt's own
    defined dimensions (clarity, evidence quality, impact depth,
    distinctiveness/pioneering, sustainability, implementation maturity,
    rubric alignment), and prefer figures paired with an effect
    (before/after, %, rate) over bare counts? Already explicit in the
    prompt's EVALUATION INSTRUCTIONS -- this checks compliance, not whether
    the instruction exists.

winner_ranking_consistency:
  description: >
    Is the returned record_id consistent with final_ranking's #1 entry --
    does the declared machine-readable winner actually match the narrative
    ranking's top pick? A mismatch here is a hard defect regardless of how
    good the prose is: the platform acts on record_id downstream, so a
    value that disagrees with the ranking is worse than either being wrong
    alone.

best_practices_grounded:
  description: >
    Are best_practices genuinely grounded in the actual strengths identified
    for this comparison, rather than generic, could-apply-to-any-comparison
    advice? Already explicit in the prompt's own JSON template
    ("Recommendations grounded in the actual strengths").

bilingual_json_contract:
  description: >
    Is the output pure JSON only (opens and closes with braces, no markdown
    or explanatory text outside it), with parallel arabic_analysis /
    english_analysis blocks each containing individual_analysis,
    comparative_analysis, final_ranking, and best_practices, using \n\n
    paragraph separation within the long-text fields? Does the Arabic use
    verb-first sentence structure (الجملة الفعلية) as the prompt instructs?

no_cross_candidate_contamination:
  description: >
    NOTE: main_prompt.txt has no client_name or entity-scoping concept at
    all currently -- a forward-looking business bar (G10), not yet a real
    prompt instruction for this use case, so a gap here reflects the
    prompt's current state, not a model failure. Are all inputs attributed
    only to the one assigned candidate, with no data or terminology mixed
    in from another candidate or organization?

overall_quality:
  description: >
    Holistic judgment: which output would a human government-excellence
    evaluator find more precise, better-grounded, and more decisive, all
    else equal?
